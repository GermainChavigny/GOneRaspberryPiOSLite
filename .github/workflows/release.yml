# Pousser un tag « v1.2.3 » lance les tests puis publie la release.
# Les consoles l'installent d'elles-mêmes (recherche au démarrage, puis toutes les 12 h).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pytest python3-aiohttp mtools dosfstools
      - run: python3 -m pytest -q tests
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
